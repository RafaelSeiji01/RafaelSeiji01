name: 🎮 Gerar telas do README

on:
  push:
    paths:
      - "perfil.properties"
      - "src/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Compilar e rodar o gerador
        run: |
          javac -encoding UTF-8 -d out $(find src -name "*.java")
          java -Dfile.encoding=UTF-8 -Dstdout.encoding=UTF-8 -cp out dev.seiji.readme.GeradorReadme perfil.properties assets

      - name: Commitar os SVGs novos
        run: |
          git config user.name "seiji-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git diff --cached --quiet || git commit -m "🎮 save game: telas atualizadas"
          git push
